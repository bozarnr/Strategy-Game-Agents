[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-game-agents"
version = "0.1.0"
description = "Clean-room strategy agents for repeated risky-choice games."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "bozarnr" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
